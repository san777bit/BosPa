<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>BosPa</title>
  <!--
    Суть старой иконки: автобус анфас, в лобовом стекле три пассажира (два места заняты,
    третье свободно), на крыше светофор загруженности. Стиль — как в приложении:
    толстая чёрная обводка, жёсткая тень без размытия, плоские цвета из theme.js
    (фон bg, светофор status, фары reward).
  -->
  <defs>
    <!-- Силуэт автобуса без заливки: из него рисуется жёсткая тень -->
    <g id="silhouette">
      <rect x="250" y="168" width="524" height="610" rx="84"/>
      <rect x="210" y="690" width="604" height="96" rx="32"/>
      <rect x="164" y="318" width="64" height="132" rx="24"/>
      <rect x="796" y="318" width="64" height="132" rx="24"/>
    </g>
  </defs>

  <!-- Фон: цвет фона приложения -->
  <rect width="1024" height="1024" fill="#BFE3FA"/>

  <!-- Жёсткая тень -->
  <use xlink:href="#silhouette" href="#silhouette" x="30" y="30" fill="#111111"/>

  <g stroke="#111111" stroke-linejoin="round" stroke-linecap="round">
    <!-- Зеркала на кронштейнах -->
    <path d="M228 384 H250 M796 384 H774" stroke-width="22" fill="none"/>
    <rect x="164" y="318" width="64" height="132" rx="24" fill="#FFFFFF" stroke-width="22"/>
    <rect x="796" y="318" width="64" height="132" rx="24" fill="#FFFFFF" stroke-width="22"/>

    <!-- Колёса -->
    <rect x="276" y="740" width="124" height="112" rx="26" fill="#111111" stroke-width="22"/>
    <rect x="624" y="740" width="124" height="112" rx="26" fill="#111111" stroke-width="22"/>

    <!-- Кузов -->
    <rect x="250" y="168" width="524" height="610" rx="84" fill="#FFFFFF" stroke-width="28"/>

    <!-- Светофор загруженности: зелёный и оранжевый горят, красный погашен -->
    <rect x="382" y="206" width="260" height="70" rx="35" fill="#111111" stroke-width="0"/>
    <rect x="404" y="226" width="62" height="30" rx="15" fill="#4ADE80" stroke-width="0"/>
    <rect x="481" y="226" width="62" height="30" rx="15" fill="#FFB547" stroke-width="0"/>
    <rect x="558" y="226" width="62" height="30" rx="15" fill="#4A2B2E" stroke-width="0"/>

    <!-- Лобовое стекло -->
    <rect x="304" y="314" width="416" height="236" rx="40" fill="#111111" stroke-width="0"/>
  </g>

  <!-- Пассажиры: двое сидят, третье место свободно (только контур) -->
  <g fill="#FFFFFF">
    <circle cx="390" cy="402" r="34"/>
    <path d="M340 550 V502 a50 50 0 0 1 100 0 V550 Z"/>
    <circle cx="512" cy="402" r="34"/>
    <path d="M462 550 V502 a50 50 0 0 1 100 0 V550 Z"/>
  </g>
  <g fill="none" stroke="#6B7280" stroke-width="10" stroke-dasharray="18 14" stroke-linecap="round">
    <circle cx="634" cy="402" r="29"/>
    <path d="M590 546 V502 a44 44 0 0 1 88 0 V546"/>
  </g>

  <g stroke="#111111" stroke-linejoin="round">
    <!-- Фары и решётка -->
    <circle cx="348" cy="626" r="44" fill="#FFD12A" stroke-width="22"/>
    <circle cx="676" cy="626" r="44" fill="#FFD12A" stroke-width="22"/>
    <rect x="444" y="606" width="136" height="40" rx="20" fill="#E5E7EB" stroke-width="14"/>

    <!-- Бампер -->
    <rect x="210" y="690" width="604" height="96" rx="32" fill="#FFFFFF" stroke-width="24"/>
  </g>
</svg>
