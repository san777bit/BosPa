# Спецификация маршрута для scripts/build_route.py.
#
# Порядок остановок — публичная страница маршрута в 2ГИС (2gis.kz/almaty/route/9430017310195857),
# проверено 2026-10-10. Обратное направление там — те же остановки в обратном порядке.
# Координаты остановок — OpenStreetMap, линия по дорогам — OSRM (данные OSM).
#
# osm: имя остановки в OSM, если оно отличается.
# approx: true — остановки нет в OSM; ставится посередине между соседями на линии.
# reverse_of: направление из тех же остановок в обратном порядке. Строится заново:
#   остановки берутся с другой стороны дороги, линия учитывает одностороннее движение.
#
# Правка относительно OSM: «Тимирязева» из 2ГИС в OSM называется «Байтурсынова»
# (угол Тимирязева и Байтурсынова). Одноимённая «Тимирязева» в OSM — в 1,5 км западнее.
id: t7
title: Троллейбус №7
short: "7"
kind: trolleybus
directions:
  - id: a
    title: → Ауэзова
    stops:
      - {name: Ж/д вокзал Алматы-1, osm: Алматы-1 теміржол вокзалы}
      - Шолохова
      - Чернышевского
      - Майбороды
      - ЗАГС
      - {name: Гимназия им. М. Турлыхановой, osm: Гимназия имени М. Турлыхановой}
      - Жумабаева
      - Дулатова
      - {name: пос. Мехзавод, osm: Посёлок Мехзавода}
      - Ясли-сад
      - Артиллерийская
      - Крамского
      - Проспект Рыскулова
      - Акпаева
      - Ломоносова
      - Иркутская
      - {name: ТЭЦ-1, osm: ТЭЦ 1}
      - Райымбека
      - Райымбека
      - Маметовой
      - Макатаева
      - Гоголя
      - Толе би
      - ул. Кабанбай батыра
      - Шевченко
      - Проспект Сейфуллина
      - Дворец спорта
      - Сатпаева
      - Университет энергетики и связи
      # В OSM эта остановка на углу Тимирязева и Байтурсынова называется «Байтурсынова»
      - {name: Тимирязева, osm: Байтурсынова}
      - {name: Микрорайон Коктем-1, osm: Микрорайон Коктем1}
      - КазНУ
      - Ботанический сад
      - Ауэзова
  - id: b
    title: → Ж/д вокзал Алматы-1
    reverse_of: a
