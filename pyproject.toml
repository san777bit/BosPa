[project]
name = "bospa"
version = "0.1.0"
description = "BosPa — краудсорсинг загруженности общественного транспорта Алматы"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.25",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bospa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
